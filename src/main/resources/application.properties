spring.application.name=agendador
server.servlet.context-path=/agendador
spring.web.error.include-message=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:file:~/test
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ForÃ§a o Hibernate a apagar e criar tudo de novo ao subir o projeto
spring.jpa.hibernate.ddl-auto=create-drop

# Exibe os SQLs diretamente pelo Logger do Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# MantÃ©m a formataÃ§Ã£o legÃ­vel (bonita) do SQL no terminal
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true